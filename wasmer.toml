# Wasmer Edge package for temporary hosting.
# The whole project is mapped so Laravel finds composer.json; .wasmerignore keeps out .env,
# local databases, logs, node_modules, .git, tests and skills. Writable data (views cache,
# SQLite bookings and site content) lives on the /data volume declared in app.yaml.

[dependencies]
"php/php" = "=8.3.403"

[fs]
"/app" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080"]
